<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agora 设计稿</title>
<style>body{margin:0;background:#0a0a0a;color:#eee;font-family:-apple-system,"PingFang SC",sans-serif}main{max-width:1400px;margin:auto;padding:32px 20px}h1{font-weight:500}h2{color:#c9a46a;font-weight:500;margin:48px 0 6px}p{color:#aaa;margin:0 0 14px;line-height:1.6}img{width:100%;border-radius:10px;border:1px solid #222}</style></head><body><main>
<h1>主题页 · The Agora 交互流程</h1><p>① 主题首页 → ② 辩论厅选人 → ③ 辩论现场 → ④ 结论 → 发布到用户故事</p>
<h2>① 主题首页</h2><p>右侧超大分类词，悬停左侧显示本周辩题与常驻名人，点「进入辩论厅」。</p><img src="1_index.jpg">
<h2>② 辩论厅 · 选谁上场</h2><p>柱廊里点选名人落到下方讲台（5 个座位），可从全部 251 人里邀请，点「召开辩论」。</p><img src="2_hall.jpg">
<h2>③ 辩论现场</h2><p>名人按立场站左右（支持/反对/未表态），每轮后换位；可 @ 单人提问、踢人拉人。</p><img src="3_debate.jpg">
<h2>④ 结论</h2><p>石碑式总结，三栏观点，可发布到 Stories 被点赞评论。</p><img src="4_verdict.jpg">
</main></body></html>
